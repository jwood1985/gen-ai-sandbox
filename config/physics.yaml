# Physics parameters for V_B⁻ (boron vacancy, negative charge state) in hBN
# All values from published DFT/experiment with citations.
# DO NOT modify without updating the citation.

# --- Central spin: V_B⁻ ---
# S = 1 (triplet ground state), C3v symmetry
# Ref: Ivády et al., Phys. Rev. B 101, 155203 (2020)
#      Gottscholl et al., Nat. Mater. 19, 540 (2020)
central_spin:
  S: 1
  # Zero-field splitting (MHz)
  # D = 3.47 GHz, E ≈ 0 (C3v symmetry, no in-plane anisotropy)
  # Ref: Gottscholl et al., Nat. Mater. 19, 540 (2020)
  D: 3470.0   # MHz
  E: 0.0      # MHz

# --- Nearest-neighbor nitrogen hyperfine tensors ---
# V_B⁻ has 3 equivalent nearest-neighbor N atoms in the basal plane.
# These must be treated as part of the central spin system, NOT as bath.
#
# ¹⁴N (I=1) hyperfine for NN nitrogen:
#   Axx = Ayy ≈ 47 MHz, Azz ≈ 85 MHz (axial symmetry about B-N bond)
#   Ref: Ivády et al., Phys. Rev. B 101, 155203 (2020)
#        Exarhos et al., Nat. Commun. 10, 222 (2019)
#
# ¹⁵N (I=1/2) hyperfine scales by gyromagnetic ratio:
#   γ(¹⁵N)/γ(¹⁴N) = -4.3173/3.0777 = -1.4027
#   So A(¹⁵N) ≈ 1.4027 × A(¹⁴N), sign flip (negative γ)
first_shell:
  n_neighbors: 3
  N14:
    I: 1
    # Hyperfine tensor (MHz), principal values [Axx, Ayy, Azz]
    # z-axis = c-axis of hBN crystal
    hyperfine: [47.0, 47.0, 85.0]
    # Quadrupole coupling constant e²qQ/h (MHz)
    # Ref: Murzakhanov et al., Phys. Rev. B 103, 245203 (2021)
    quadrupole_coupling: 2.11
    eta: 0.0  # asymmetry parameter (axial symmetry)
  N15:
    I: 0.5
    # Scaled from ¹⁴N by |γ(¹⁵N)/γ(¹⁴N)|
    hyperfine: [65.9, 65.9, 119.2]
    # No quadrupole for I=1/2
    quadrupole_coupling: 0.0
    eta: 0.0

# --- Bath nuclear species ---
# Gyromagnetic ratios in MHz/T (γ/2π)
# Ref: Stone, Table of Nuclear Magnetic Dipole and Electric Quadrupole
#      Moments, IAEA Nuclear Data Services, INDC(NDS)-0658 (2014)
bath_species:
  B10:
    isotope: "10B"
    I: 3
    gamma: 2.8747      # MHz/T
    # Quadrupole moment Q = 8.459 fm² = 8.459e-2 barn
    # Quadrupole coupling for B site in hBN (MHz)
    # Ref: Liang & Leung, J. Phys. Chem. A 115, 2226 (2011)
    quadrupole_coupling: 1.39
    eta: 0.0
  B11:
    isotope: "11B"
    I: 1.5
    gamma: 13.663      # MHz/T
    # Ref: Liang & Leung, J. Phys. Chem. A 115, 2226 (2011)
    quadrupole_coupling: 2.94
    eta: 0.0
  N14:
    isotope: "14N"
    I: 1
    gamma: 3.0777      # MHz/T
    # Ref: Liang & Leung, J. Phys. Chem. A 115, 2226 (2011)
    quadrupole_coupling: 2.11
    eta: 0.0
  N15:
    isotope: "15N"
    I: 0.5
    gamma: -4.3173     # MHz/T  (negative!)
    quadrupole_coupling: 0.0
    eta: 0.0

# --- hBN lattice parameters ---
# Ref: Pease, Acta Crystallogr. 5, 356 (1952)
#      Lynch & Drickamer, J. Chem. Phys. 44, 181 (1966)
lattice:
  a: 2.504  # Å, in-plane lattice constant
  c: 6.661  # Å, out-of-plane (interlayer distance = c/2 = 3.33 Å)
  space_group: "P6_3/mmc"
  # Basis positions (fractional coordinates)
  # B at (0, 0, 0) and (1/3, 2/3, 1/2)
  # N at (0, 0, 1/2) and (1/3, 2/3, 0)
  # After vacancy: remove one B site, 3 NN nitrogens become first-shell

# --- Magnetic field points ---
# Units: mT
magnetic_fields:
  - 0.0       # Zero field
  - 50.0      # Typical ODMR measurement field
  - 300.0     # High-field regime

# --- g-factor ---
# Ref: Gottscholl et al., Nat. Mater. 19, 540 (2020)
g_factor: 2.0
